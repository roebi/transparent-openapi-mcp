# CI workflow (R-STACK-002/003): runs on every push and pull request.
# Enforces the standing hard gates - tests, ShellCheck, Python SAST
# (bandit + semgrep), and a Trivy scan of the built container image.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Run tests
        run: uv run pytest -v

  shellcheck:
    name: ShellCheck (entrypoint.sh, podman_build.sh, podman_run.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run ShellCheck
        run: shellcheck entrypoint.sh podman_build.sh podman_run.sh

  bandit:
    name: Python SAST (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
      - name: Install bandit
        run: uv add --dev bandit
      - name: Run bandit
        run: uv run bandit -r src/

  semgrep:
    name: Python SAST (semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      - name: Run semgrep
        # Public registry rulesets (no semgrep.dev account/token
        # needed) - "semgrep ci" requires login, "semgrep scan" with
        # explicit p/* configs does not.
        run: semgrep scan --config=p/python --config=p/security-audit --error src/

  container-scan:
    name: Container scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Build image
        run: ./podman_build.sh
        env:
          IMAGE_NAME: transparent-openapi-mcp
          IMAGE_TAG: ci
      - name: Export image to tarball
        # trivy-action looks for a running Docker/containerd/Podman
        # socket to query the image by reference - rootless Podman in
        # CI doesn't expose one by default, so the image (built fine)
        # can't be found that way. Exporting to a tarball and scanning
        # that directly sidesteps the daemon lookup entirely.
        run: podman save -o transparent-openapi-mcp-ci.tar transparent-openapi-mcp:ci
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          input: transparent-openapi-mcp-ci.tar
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          # Only fail on CVEs with an available fix we haven't applied
          # yet - upstream-unfixed OS package CVEs (no patched version
          # exists at all) would otherwise block the gate permanently
          # with nothing actionable to do about them.
          ignore-unfixed: true
