[project]
name = "transparent-openapi-mcp"
version = "0.1.0"
description = "KISS MCP server that maps OpenAPI v3 specs 1:1 onto MCP tools, transparently to spec changes"
readme = "README.md"
authors = [
    { name = "roebi", email = "3611826+roebi@users.noreply.github.com" }
]
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.0.0",
    "pydantic>=2.13.4",
]

[project.scripts]
transparent-openapi-mcp = "transparent_openapi_mcp:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
    "semgrep>=1.79.0",
]
